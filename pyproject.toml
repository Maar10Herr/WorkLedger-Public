[project]
name = "workledger"
version = "0.2.0"
description = "Self-hosted work, travel, tax, and reimbursement evidence ledger"
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "celery[redis]>=5.6,<5.7",
  "db-timetables>=0.1.1,<0.2",
  "django>=5.2.17,<5.3",
  "gunicorn>=23,<24",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pillow-heif>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pypdfium2>=4.30,<6",
  "python-magic>=0.4.27,<0.5",
  "sqlparse>=0.6,<0.7",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=5.2,<6",
  "hypothesis>=6.130,<7",
  "mypy>=1.17,<2",
  "playwright>=1.54,<2",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.11,<5",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --strict-config"
markers = ["e2e: browser-based end-to-end tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001", "RUF012"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
