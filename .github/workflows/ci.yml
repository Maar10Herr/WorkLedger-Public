name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python and Django
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy apps config tests
      - name: Test with disposable SQLite settings
        run: uv run pytest -q

  frontend:
    name: Browser assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:js

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check scripts
        run: bash -n ./*.sh docker/*.sh
